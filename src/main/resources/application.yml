# Все динамические и чувствительные параметры берутся из переменных окружения
# (см. .env.example). Значение после двоеточия — дефолт для локального запуска.
server:
  port: ${PORT:8080}
  # Корректные схема/хост за reverse-proxy PaaS (Render, Koyeb, Railway)
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  application:
    name: recipe-platform
  datasource:
    # DB_URL имеет приоритет; иначе URL собирается из DB_HOST/DB_PORT/DB_NAME
    # (так Render передаёт реквизиты managed PostgreSQL в render.yaml).
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:recipe_db}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:07Omemeg}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true
  # Database schema and seed data come exclusively from schema.sql / data.sql,
  # executed by Spring Boot's own SQL initializer on every startup. Hibernate
  # only validates the JPA mappings against that schema (ddl-auto=validate);
  # it never creates or alters tables itself.
  sql:
    init:
      mode: always

app:
  async:
    nutrition-initial-delay-ms: ${NUTRITION_INITIAL_DELAY_MS:10000}
  cors:
    # Список origin-паттернов через запятую, например:
    # https://recipe-platform-frontend.onrender.com,http://localhost:*
    allowed-origins: ${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
