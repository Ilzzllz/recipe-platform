databases:
  - name: recipe-platform-db
    plan: free
    region: frankfurt
    databaseName: recipe_db
    user: recipe_user
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: web
    name: recipe-platform
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeploy: false
    envVars:
      - key: DB_HOST
        fromDatabase: { name: recipe-platform-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: recipe-platform-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: recipe-platform-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: recipe-platform-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: recipe-platform-db, property: password }
      - key: CORS_ORIGINS
        value: https://*.onrender.com
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=70.0 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k
      - key: DB_POOL_SIZE
        value: "3"
      - key: NUTRITION_INITIAL_DELAY_MS
        value: "10000"
